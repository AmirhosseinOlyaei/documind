spring:
  application:
    name: documind-api
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:documind}
    username: ${DB_USERNAME:documind}
    password: ${DB_PASSWORD:documind}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

documind:
  openai:
    api-key: ${OPENAI_API_KEY:demo}
    model: gpt-4o-mini
  embedding:
    use-local: true
  vector-store:
    dimension: 384
    table-name: document_embeddings

server:
  port: 8080

logging:
  level:
    com.documind: DEBUG
    dev.langchain4j: DEBUG
